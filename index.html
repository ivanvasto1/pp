  <style>
    :root {
      --green: #4dff9a;
      --green-dim: #2ecc71;
      --green-glow: rgba(77, 255, 154, 0.35);
      --bg-dark: #060f0a;
      --card-bg: rgba(12, 30, 20, 0.92);
      --text: #e8fff3;
      --text-muted: rgba(200, 240, 220, 0.55);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(46,204,113,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(77,255,154,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 36px 28px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(77, 255, 154, 0.15);
      box-shadow:
        0 0 0 1px rgba(77,255,154,0.05),
        0 40px 80px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid rgba(77,255,154,0.25);
      box-shadow: 0 0 32px var(--green-glow);
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--green);
      text-shadow: 0 0 28px rgba(77,255,154,0.5);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(77,255,154,0.08);
      border: 1px solid rgba(77,255,154,0.2);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.5px;
      margin-bottom: 18px;
    }

    .stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
    }
    .stars-icons {
      color: #ffc83d;
      font-size: 16px;
      letter-spacing: 2px;
    }
    .stars-score {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(77,255,154,0.2), transparent);
      margin-bottom: 20px;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 26px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(77,255,154,0.05);
      border: 1px solid rgba(77,255,154,0.12);
      border-radius: 14px;
      padding: 13px 16px;
      text-align: left;
      transition: border-color 0.2s, background 0.2s;
    }
    .feature:hover {
      background: rgba(77,255,154,0.09);
      border-color: rgba(77,255,154,0.25);
    }

    .feature-icon {
      font-size: 20px;
      flex-shrink: 0;
      width: 28px;
      text-align: center;
    }

    .feature-text {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    .feature-text .highlight {
      color: var(--green);
    }

    .feature-text .handle {
      display: inline-block;
      background: rgba(77,255,154,0.12);
      border-radius: 6px;
      padding: 1px 7px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      margin-left: 4px;
    }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 17px 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #4dff9a 0%, #27c96a 100%);
      color: #031a0c;
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-decoration: none;
      box-shadow: 0 8px 32px rgba(77,255,154,0.4);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      animation: pulse 3s ease-in-out infinite;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 48px rgba(77,255,154,0.65);
    }
    .cta:active {
      transform: translateY(0);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(77,255,154,0.4); }
      50%       { box-shadow: 0 10px 44px rgba(77,255,154,0.65); }
    }

    .trust {
      margin-top: 12px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }
    .trust span {
      color: rgba(77,255,154,0.6);
    }
  </style>
</head>
